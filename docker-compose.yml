name: aigate

x-backend-environment: &backend-environment
  AIGATE_DATABASE_URL: ${AIGATE_DATABASE_URL:?set AIGATE_DATABASE_URL in .env}
  AIGATE_CHANNEL_ENCRYPTION_KEY: ${AIGATE_CHANNEL_ENCRYPTION_KEY:?set AIGATE_CHANNEL_ENCRYPTION_KEY in .env}
  AIGATE_CORS_ALLOWED_ORIGINS: ${AIGATE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    bootstrap:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-AiGate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "${AIGATE_DATABASE_URL:?set AIGATE_DATABASE_URL in .env}", "up"]
    restart: "no"

  bootstrap:
    image: pgvector/pgvector:pg16
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-AiGate}
      AIGATE_BOOTSTRAP_TENANT_ID: ${AIGATE_BOOTSTRAP_TENANT_ID:?set AIGATE_BOOTSTRAP_TENANT_ID in .env}
      AIGATE_BOOTSTRAP_TENANT_NAME: ${AIGATE_BOOTSTRAP_TENANT_NAME:-AiGate Pilot}
      AIGATE_BOOTSTRAP_ORGANIZATION_ID: ${AIGATE_BOOTSTRAP_ORGANIZATION_ID:?set AIGATE_BOOTSTRAP_ORGANIZATION_ID in .env}
      AIGATE_BOOTSTRAP_ORGANIZATION_NAME: ${AIGATE_BOOTSTRAP_ORGANIZATION_NAME:-IT}
    volumes:
      - ./scripts/bootstrap.sql:/bootstrap.sql:ro
    command:
      - /bin/sh
      - -ec
      - >-
        psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
        -v tenant_id="$${AIGATE_BOOTSTRAP_TENANT_ID}"
        -v tenant_name="$${AIGATE_BOOTSTRAP_TENANT_NAME}"
        -v organization_id="$${AIGATE_BOOTSTRAP_ORGANIZATION_ID}"
        -v organization_name="$${AIGATE_BOOTSTRAP_ORGANIZATION_NAME}"
        -f /bootstrap.sql
    restart: "no"

  api:
    <<: *backend-service
    command: ["api"]
    environment:
      <<: *backend-environment
      AIGATE_HTTP_ADDR: :8080
      AIGATE_JWT_SECRET: ${AIGATE_JWT_SECRET:?set AIGATE_JWT_SECRET in .env}
      AIGATE_GATEWAY_BASE_URL: http://gateway:8081
      AIGATE_BOOTSTRAP_TENANT_ID: ${AIGATE_BOOTSTRAP_TENANT_ID:?set AIGATE_BOOTSTRAP_TENANT_ID in .env}
      AIGATE_BOOTSTRAP_ORGANIZATION_ID: ${AIGATE_BOOTSTRAP_ORGANIZATION_ID:?set AIGATE_BOOTSTRAP_ORGANIZATION_ID in .env}
      AIGATE_BOOTSTRAP_ADMIN_EMAIL: ${AIGATE_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AIGATE_BOOTSTRAP_ADMIN_PASSWORD: ${AIGATE_BOOTSTRAP_ADMIN_PASSWORD:?set AIGATE_BOOTSTRAP_ADMIN_PASSWORD in .env}
      AIGATE_OBJECT_STORAGE_PATH: ${AIGATE_OBJECT_STORAGE_PATH:-/app/data/objects}
      AIGATE_OBJECT_MAX_BYTES: ${AIGATE_OBJECT_MAX_BYTES:-20971520}
      AIGATE_EMBEDDING_BASE_URL: ${AIGATE_EMBEDDING_BASE_URL:-}
      AIGATE_EMBEDDING_API_KEY: ${AIGATE_EMBEDDING_API_KEY:-}
      AIGATE_EMBEDDING_MODEL: ${AIGATE_EMBEDDING_MODEL:-text-embedding-3-small}
      AIGATE_EMBEDDING_DIMENSIONS: ${AIGATE_EMBEDDING_DIMENSIONS:-384}
    ports:
      - "8080:8080"
    volumes:
      - object_data:/app/data/objects
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    <<: *backend-service
    command: ["gateway"]
    environment:
      <<: *backend-environment
      AIGATE_GATEWAY_ADDR: :8081
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend-service
    command: ["worker"]
    environment:
      <<: *backend-environment
      AIGATE_OBJECT_STORAGE_PATH: ${AIGATE_OBJECT_STORAGE_PATH:-/app/data/objects}
      AIGATE_OBJECT_MAX_BYTES: ${AIGATE_OBJECT_MAX_BYTES:-20971520}
      AIGATE_EMBEDDING_BASE_URL: ${AIGATE_EMBEDDING_BASE_URL:-}
      AIGATE_EMBEDDING_API_KEY: ${AIGATE_EMBEDDING_API_KEY:-}
      AIGATE_EMBEDDING_MODEL: ${AIGATE_EMBEDDING_MODEL:-text-embedding-3-small}
      AIGATE_EMBEDDING_DIMENSIONS: ${AIGATE_EMBEDDING_DIMENSIONS:-384}
    volumes:
      - object_data:/app/data/objects

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL:-http://localhost:8081}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  object_data:
