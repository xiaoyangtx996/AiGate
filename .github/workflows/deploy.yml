name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: AiGate-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AiGate-app/pnpm-lock.yaml

      - name: Cache Nuxt
        uses: actions/cache@v4
        with:
          path: |
            AiGate-app/.nuxt
            AiGate-app/node_modules/.cache
            AiGate-app/node_modules/.vite
          key: ${{ runner.os }}-deploy-${{ hashFiles('AiGate-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deploy-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigate
          BETTER_AUTH_SECRET: ci-build-secret-min-32-chars-long

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/aigate:latest
          echo "Building Docker image: $IMAGE"
          docker build -f AiGate-app/Dockerfile -t "$IMAGE" AiGate-app

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/aigate:latest
          docker push "$IMAGE"

      - name: Deploy to production
        run: |
          echo "Deploying AiGate to production..."
          echo ""
          echo "镜像已推送至: ghcr.io/${{ github.repository }}/aigate:latest"
          echo ""
          echo "生产服务器更新流程（Docker Compose）："
          echo "  1. ssh 登录生产主机，进入部署目录"
          echo "  2. docker login ghcr.io -u <username> -p <token>"
          echo "  3. docker compose pull"
          echo "  4. docker compose up -d"
          echo ""
          echo "更新前请执行数据库迁移："
          echo "  pnpm dlx drizzle-kit migrate"
          echo ""
          echo "PM2 部署请参考 AiGate-app/docs/deploy/README.md"
