name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: AiGate-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AiGate-app/pnpm-lock.yaml

      - name: Cache Nuxt
        uses: actions/cache@v4
        with:
          path: |
            AiGate-app/.nuxt
            AiGate-app/node_modules/.cache
            AiGate-app/node_modules/.vite
          key: ${{ runner.os }}-deploy-${{ hashFiles('AiGate-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deploy-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigate
          BETTER_AUTH_SECRET: ci-build-secret-min-32-chars-long

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -f AiGate-app/Dockerfile -t aigate:latest AiGate-app
          echo "Placeholder: docker push aigate:latest && deploy to your target"

      - name: Deploy to production
        run: |
          echo "Deploying AiGate to production..."
          echo "Placeholder: wire up your deployment target here."
          # Vercel:  npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          # Docker:  docker push aigate:latest && kubectl rollout restart ...
          # PM2/SSH: rsync + pm2 reload ecosystem.config.js
