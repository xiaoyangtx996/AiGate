name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: AiGate-app

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AiGate-app/pnpm-lock.yaml

      - name: Cache Nuxt and Vitest
        uses: actions/cache@v4
        with:
          path: |
            AiGate-app/.nuxt
            AiGate-app/node_modules/.cache
            AiGate-app/node_modules/.vite
          key: ${{ runner.os }}-build-${{ hashFiles('AiGate-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: AiGate-app/coverage/
          retention-days: 14

      # E2E tests require a running dev server and browser dependencies.
      # Run locally with `pnpm dev` + `pnpm test:e2e`, or enable this step
      # after adding Playwright browser install and webServer to playwright.config.ts.
      # - name: E2E
      #   run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigate
          BETTER_AUTH_SECRET: ci-build-secret-min-32-chars-long
