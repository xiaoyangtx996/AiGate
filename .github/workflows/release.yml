name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: AiGate-app

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AiGate-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigate
          BETTER_AUTH_SECRET: ci-build-secret-min-32-chars-long

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/aigate:${{ github.ref_name }}
          docker build -f AiGate-app/Dockerfile -t "$IMAGE" AiGate-app

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/aigate:${{ github.ref_name }}
          docker push "$IMAGE"
