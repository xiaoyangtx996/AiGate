# AiGate 本地/预发布 Docker 编排模板
#
# 生产部署说明：
# - 请勿直接使用本文件上线；需替换镜像、密钥、卷挂载与网络策略
# - 使用外部托管 PostgreSQL 或云 RDS，并配置 SSL 连接
# - 通过反向代理（Nginx/Caddy）终止 TLS，设置 BETTER_AUTH_URL 为公网地址
# - 密钥（BETTER_AUTH_SECRET、API Key 等）请使用密钥管理服务注入
#
# 本地启动：在 AiGate-app 目录执行 `docker compose up -d --build`

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aigate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aigate']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aigate
      BETTER_AUTH_SECRET: change-me-in-production-min-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      NUXT_APP_NAME: AiGate
      NUXT_APP_DESC: Enterprise AI Management Platform
      NODE_ENV: production
      SENTRY_DSN: ''
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
